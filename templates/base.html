<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
  <title> Sahiti Doke </title>

  <script src="/themetoggle.js"></script>
  <script async src="/footnote.js"></script>

  <link rel="shortcut icon" href="/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Geist+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="/style.css"/>
  <script defer src="/dots.js"></script>

  {% block extra_head %} {% endblock extra_head %}
</head>

<body>
  <canvas id="dots" aria-hidden="true"></canvas>
  <header>
    <a href="/" class="title" aria-label="sahiti doke">
      <span id="header-name" class="secret-trigger"><span class="typed" data-text="sahiti doke"></span><span class="caret" aria-hidden="true"></span></span>
    </a>
    <script>
    // type the name out on a fresh visit or reload, but not when moving between pages on the site
    (function () {
      const el = document.querySelector("#header-name .typed");
      const text = el.dataset.text;
      const nav = performance.getEntriesByType("navigation")[0];
      const type = nav ? nav.type : "navigate";
      let internal = false;
      try { internal = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
      const animate = type === "reload" || (type === "navigate" && !internal);
      if (!animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = text; return; }
      let i = 0;
      function step() {
        el.textContent = text.slice(0, ++i);
        if (i < text.length) setTimeout(step, text[i] === " " ? 180 : 90 + Math.random() * 90);
      }
      setTimeout(step, 400);
    })();
    </script>
    {% set writing = get_section(path="writing/_index.md") %}
    <nav class="header-links">
      <a href="/">home</a>
      <a href="/blog">portfolio</a>
      <a href="{{ writing.permalink }}">blog</a>
      <a href="/blog/abme/">about</a>
      <a href="https://github.com/sahitidoke" target="_blank" rel="noopener noreferrer">[github]</a>
      <a href="https://www.linkedin.com/in/sahiti-doke-2b59b3262/" target="_blank" rel="noopener noreferrer">[linkedin]</a>
      <a href="https://x.com/i_love_saes" target="_blank" rel="noopener noreferrer">[x]</a>
      <a href="https://cal.com/sahiti-doke-ybeuan" target="_blank" rel="noopener noreferrer">[chat]</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">[dark]</button>
    </nav>
  </header>

  <main>
    {% block content %} {% endblock %}
  </main>

  <footer>
    <a href="mailto:sdoke@ucsb.edu">sdoke@ucsb.edu</a>
  </footer>
  <script>
  let clicks = 0;

  document.querySelector(".secret-trigger").addEventListener("click", () => {
    clicks++;

    if (clicks === 3) {
      window.location.href = "/blog/vibes/";
    }
  });
</script>

</body>
</html>
