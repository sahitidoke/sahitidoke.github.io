{% extends "base.html" %}

{% block content %}

{% set writing = get_section(path="writing/_index.md") %}

<section class="eyebrow-section">
    <h2 class="eyebrow">writing</h2>
    <ul class="blog-posts">
        {% for page in writing.pages %}
            <li>
                <span>
                    <i>
                        <time datetime="{{ page.date }}">
                            {{ page.date }}
                        </time>
                    </i>
                </span>
                <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
            </li>
        {% endfor %}
    </ul>
</section>

{% endblock content %}
