# The URL the site will be built for
base_url = "https://sahitidoke.github.io"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Create RSS feed from all pages with a date
generate_feeds = true
feed_filenames = ["rss.xml"]

[extra]
# Put all your custom variables here
emoji-support = true
# now playing widget on the homepage (spotify scrobbles to last.fm); leave empty to hide it
lastfm_user = "buttertan"
lastfm_key = "077e8d41406ab98d47f7570d84608099"

